<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>候補者マッチングプロンプト生成</title>
  <style>
    body {
      font-family: 'Yu Gothic UI', sans-serif;
      background: #f2f4fc;
      color: #333;
      padding: 2em;
      max-width: 700px;
      margin: auto;
    }
    h1 {
      font-size: 1.6em;
      color: #2b3674;
      margin-bottom: 1em;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 1.5em;
      margin-bottom: 0.3em;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 0.8em;
      border: 1px solid #ccc;
      border-radius: 0.5em;
      font-size: 1em;
      box-sizing: border-box;
    }
    button {
      background-color: #5865f2;
      color: white;
      border: none;
      margin-top: 1.5em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #4752c4;
    }
    textarea {
      height: 150px;
    }
    .output-area {
      margin-top: 2em;
      background: #fff;
      border: 1px dashed #999;
      padding: 1em;
      border-radius: 0.5em;
    }
    .output-area h2 {
      margin-top: 0;
      font-size: 1.2em;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>🗳️ あなたに合う候補者をChatGPTで探すプロンプト作成</h1>

  <label for="region">あなたの選挙区（都道府県）</label>
  <select id="region">
    <option value="">-- 都道府県を選んでください --</option>
    <option value="北海道">北海道</option>
    <option value="青森県">青森県</option>
    <option value="岩手県">岩手県</option>
    <option value="宮城県">宮城県</option>
    <option value="秋田県">秋田県</option>
    <option value="山形県">山形県</option>
    <option value="福島県">福島県</option>
    <option value="茨城県">茨城県</option>
    <option value="栃木県">栃木県</option>
    <option value="群馬県">群馬県</option>
    <option value="埼玉県">埼玉県</option>
    <option value="千葉県">千葉県</option>
    <option value="東京都">東京都</option>
    <option value="神奈川県">神奈川県</option>
    <option value="新潟県">新潟県</option>
    <option value="富山県">富山県</option>
    <option value="石川県">石川県</option>
    <option value="福井県">福井県</option>
    <option value="山梨県">山梨県</option>
    <option value="長野県">長野県</option>
    <option value="岐阜県">岐阜県</option>
    <option value="静岡県">静岡県</option>
    <option value="愛知県">愛知県</option>
    <option value="三重県">三重県</option>
    <option value="滋賀県">滋賀県</option>
    <option value="京都府">京都府</option>
    <option value="大阪府">大阪府</option>
    <option value="兵庫県">兵庫県</option>
    <option value="奈良県">奈良県</option>
    <option value="和歌山県">和歌山県</option>
    <option value="鳥取県">鳥取県</option>
    <option value="島根県">島根県</option>
    <option value="岡山県">岡山県</option>
    <option value="広島県">広島県</option>
    <option value="山口県">山口県</option>
    <option value="徳島県">徳島県</option>
    <option value="香川県">香川県</option>
    <option value="愛媛県">愛媛県</option>
    <option value="高知県">高知県</option>
    <option value="福岡県">福岡県</option>
    <option value="佐賀県">佐賀県</option>
    <option value="長崎県">長崎県</option>
    <option value="熊本県">熊本県</option>
    <option value="大分県">大分県</option>
    <option value="宮崎県">宮崎県</option>
    <option value="鹿児島県">鹿児島県</option>
    <option value="沖縄県">沖縄県</option>
  </select>

  <label for="opinion">あなたの政治的な考え方</label>
  <textarea id="opinion" placeholder="例：教育の充実、持続可能なエネルギー政策、食料安全保障、子育て支援の強化 など"></textarea>

  <label for="preferredParty">支持してもいい政党</label>
  <select id="preferredParty">
    <option value="">（選択なし）</option>
    <option value="自由民主党">自由民主党</option>
    <option value="立憲民主党">立憲民主党</option>
    <option value="日本維新の会">日本維新の会</option>
    <option value="公明党">公明党</option>
    <option value="国民民主党">国民民主党</option>
    <option value="日本共産党">日本共産党</option>
    <option value="れいわ新選組">れいわ新選組</option>
    <option value="参政党">参政党</option>
    <option value="社会民主党">社会民主党</option>
    <option value="日本保守党">日本保守党</option>
    <option value="無所属">無所属</option>
  </select>

  <label for="excludeParty">除外したい政党や勢力</label>
  <select id="excludeParty">
    <option value="">（選択なし）</option>
    <option value="自由民主党">自由民主党</option>
    <option value="立憲民主党">立憲民主党</option>
    <option value="日本維新の会">日本維新の会</option>
    <option value="公明党">公明党</option>
    <option value="国民民主党">国民民主党</option>
    <option value="日本共産党">日本共産党</option>
    <option value="れいわ新選組">れいわ新選組</option>
    <option value="参政党">参政党</option>
    <option value="社会民主党">社会民主党</option>
    <option value="日本保守党">日本保守党</option>
    <option value="無所属">無所属</option>
  </select>

  <button onclick="generatePrompt()">プロンプト生成</button>

  <div class="output-area">
    <h2>🔽 ChatGPTにコピペするプロンプト</h2>
    <textarea id="output" readonly></textarea>
  </div>

  <script>
    function generatePrompt() {
      const region = document.getElementById('region').value.trim();
      const opinion = document.getElementById('opinion').value.trim();
      const preferred = document.getElementById('preferredParty').value;
      const exclude = document.getElementById('excludeParty').value;

      let conflictWarning = '';
      if (preferred && exclude && preferred === exclude) {
        conflictWarning = '\n※注意：支持政党と除外政党が重複しています。どちらかを修正してください。';
      }

      const prompt = 
`私は${region}に住んでいます。
以下のような政治的な考え方を持っています：
${opinion}

比例代表では、私の思想に合致する政党を挙げてください。
以下の政党は支持しても良いと考えています：${preferred || '（特になし）'}
以下の政党は除外対象です：${exclude || '（特になし）'}${conflictWarning}

これを踏まえて、選挙区・比例の両方において、私の考えに合いそうな候補者や政党を教えてください。`;

      document.getElementById('output').value = prompt;
    }
  </script>
</body>
</html>
