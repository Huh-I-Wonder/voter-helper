<!DOCTYPE html>
<html lang="ja">
  <!-- Ver1.1 / 重視テーマ1個＋その他複数選択方式に変更 -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>候補者マッチングプロンプト生成</title>
  <style>
    body {
      font-family: 'Yu Gothic UI', sans-serif;
      background: #f2f4fc;
      color: #333;
      padding: 2em;
      max-width: 700px;
      margin: auto;
    }
    h1 {
      font-size: 1.6em;
      color: #2b3674;
      margin-bottom: 1em;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 1.5em;
      margin-bottom: 0.3em;
    }
    select, textarea, button {
      width: 100%;
      padding: 0.8em;
      border: 1px solid #ccc;
      border-radius: 0.5em;
      font-size: 1em;
      box-sizing: border-box;
    }
    button {
      background-color: #5865f2;
      color: white;
      border: none;
      margin-top: 1.5em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #4752c4;
    }
    textarea {
      height: 150px;
    }
    .output-area {
      margin-top: 2em;
      background: #fff;
      border: 1px dashed #999;
      padding: 1em;
      border-radius: 0.5em;
    }
    .output-area h2 {
      margin-top: 0;
      font-size: 1.2em;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>🗳️ あなたに合う候補者をAIで探すプロンプト作成</h1>

  <label for="region">あなたの選挙区（都道府県）</label>
  <select id="region">
    <option value="">-- 都道府県を選んでください --</option>
    <option value="北海道">北海道</option>
    <option value="青森県">青森県</option>
    <option value="岩手県">岩手県</option>
    <option value="宮城県">宮城県</option>
    <option value="秋田県">秋田県</option>
    <option value="山形県">山形県</option>
    <option value="福島県">福島県</option>
    <option value="茨城県">茨城県</option>
    <option value="栃木県">栃木県</option>
    <option value="群馬県">群馬県</option>
    <option value="埼玉県">埼玉県</option>
    <option value="千葉県">千葉県</option>
    <option value="東京都">東京都</option>
    <option value="神奈川県">神奈川県</option>
    <option value="新潟県">新潟県</option>
    <option value="富山県">富山県</option>
    <option value="石川県">石川県</option>
    <option value="福井県">福井県</option>
    <option value="山梨県">山梨県</option>
    <option value="長野県">長野県</option>
    <option value="岐阜県">岐阜県</option>
    <option value="静岡県">静岡県</option>
    <option value="愛知県">愛知県</option>
    <option value="三重県">三重県</option>
    <option value="滋賀県">滋賀県</option>
    <option value="京都府">京都府</option>
    <option value="大阪府">大阪府</option>
    <option value="兵庫県">兵庫県</option>
    <option value="奈良県">奈良県</option>
    <option value="和歌山県">和歌山県</option>
    <option value="鳥取県">鳥取県</option>
    <option value="島根県">島根県</option>
    <option value="岡山県">岡山県</option>
    <option value="広島県">広島県</option>
    <option value="山口県">山口県</option>
    <option value="徳島県">徳島県</option>
    <option value="香川県">香川県</option>
    <option value="愛媛県">愛媛県</option>
    <option value="高知県">高知県</option>
    <option value="福岡県">福岡県</option>
    <option value="佐賀県">佐賀県</option>
    <option value="長崎県">長崎県</option>
    <option value="熊本県">熊本県</option>
    <option value="大分県">大分県</option>
    <option value="宮崎県">宮崎県</option>
    <option value="鹿児島県">鹿児島県</option>
    <option value="沖縄県">沖縄県</option>
  </select>

  <label for="priority-topic">最も重視する政策テーマを選んでください（1つ）</label>
  <select id="priority-topic">
    <option value="">-- テーマを選んでください --</option>
    <option value="防衛・安全保障">防衛・安全保障</option>
    <option value="経済・税制">経済・税制</option>
    <option value="教育・若者支援">教育・若者支援</option>
    <option value="社会保障">社会保障</option>
    <option value="移民・国籍">移民・国籍</option>
    <option value="環境・エネルギー">環境・エネルギー</option>
    <option value="人権・多様性">人権・多様性</option>
    <option value="地域・農業">地域・農業</option>
  </select>

  <label for="custom-tone">プロンプト構文を選択（任意）</label>
  <select id="custom-tone">
    <option value="standard">通常構文（候補者の提示のみ）</option>
    <option value="strong">要望強め（希望に極力沿うよう強調）</option>
    <option value="ranked">ランク付け形式（一致度順で候補提示）</option>
    <option value="explain">理由詳しく（候補者ごとの選定理由も記載）</option>
  </select>

  <label for="stance-free">その他に重視したい点（自由記述・任意）</label>
  <textarea id="stance-free" placeholder="例：農政に力を入れてほしい、日米安保の見直し、表現の自由など"></textarea>

  <button onclick="generatePrompt()">🛠️ プロンプトを生成する</button>

  <div class="output-area" id="output">
    <h2>📝 生成されたプロンプト</h2>
    <textarea readonly id="prompt-text"></textarea>
    <button id="copy-button" onclick="copyPrompt(this)">📋 プロンプトをコピーする</button>
  </div>

  <script>
    function copyPrompt(button) {
      const text = document.getElementById("prompt-text").value;
      navigator.clipboard.writeText(text).then(() => {
        button.textContent = "✅ コピー成功！";
        button.style.backgroundColor = "#4caf50";
        setTimeout(() => {
          button.textContent = "📋 プロンプトをコピーする";
          button.style.backgroundColor = "#5865f2";
        }, 2000);
      }).catch(() => {
        alert("コピーに失敗しました。手動で選択してください。");
      });
    }

    function generatePrompt() {
      const region = document.getElementById('region').value;
      const tone = document.getElementById('custom-tone').value;
      const priority = document.getElementById('priority-topic').value;
      const stanceFree = document.getElementById('stance-free').value.trim();

      let prompt = "";
      if (tone === "strong") {
        prompt += `あなたは政治アドバイザーです。以下の希望に極力沿う候補者を${region}選挙区および比例代表から厳選してください。\n`;
      } else if (tone === "ranked") {
        prompt += `以下の条件に合致する候補者を、${region}選挙区および比例代表から候補順にランク付けして提示してください。\n`;
      } else if (tone === "explain") {
        prompt += `以下の条件に合致する候補者を、${region}選挙区および比例代表から探し、候補者ごとに理由を詳しく説明してください。\n`;
      } else {
        prompt += `以下の条件に基づき、${region}選挙区および比例代表から候補者を提案してください。\n`;
      }

      if (priority) {
        prompt += `最も重視する政策テーマ：${priority}\n`;
      }

      if (stanceFree) {
        prompt += `その他に重視する点：${stanceFree}\n`;
      }

      prompt += `以下の情報を含めて提示してください：\n- 候補者の氏名\n- 所属政党\n- 上記のスタンスとの一致度\n- 判断の根拠や実績（可能であれば）\n- 推奨理由（簡潔に）`;

      document.getElementById('prompt-text').value = prompt;
    }
  </script>

  <p style="font-size:0.9em; color:#666; margin-top:2em;">
    このツールは選挙運動を目的としたものではありません。入力された内容に基づき、AIによる中立的な提案を生成する参考用ツールです。最終的な判断はご自身で行ってください。
  </p>
</body>
</html>
