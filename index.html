<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>候補者マッチングプロンプト生成</title>
  <style>
    body {
      font-family: 'Yu Gothic UI', sans-serif;
      background: #f2f4fc;
      color: #333;
      padding: 2em;
      max-width: 700px;
      margin: auto;
    }
    h1 {
      font-size: 1.6em;
      color: #2b3674;
      margin-bottom: 1em;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 1.5em;
      margin-bottom: 0.3em;
    }
    input, textarea, button {
      width: 100%;
      padding: 0.8em;
      border: 1px solid #ccc;
      border-radius: 0.5em;
      font-size: 1em;
      box-sizing: border-box;
    }
    button {
      background-color: #5865f2;
      color: white;
      border: none;
      margin-top: 1.5em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #4752c4;
    }
    textarea {
      height: 150px;
    }
    .output-area {
      margin-top: 2em;
      background: #fff;
      border: 1px dashed #999;
      padding: 1em;
      border-radius: 0.5em;
    }
    .output-area h2 {
      margin-top: 0;
      font-size: 1.2em;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>📄 あなたに合う候補者をChatGPTで探すプロンプト生成</h1>

  <label for="region">あなたの選挙区（都道府県）</label>
  <input type="text" id="region" placeholder="例：神奈川県">

  <label for="opinion">あなたの政治的な考え方</label>
  <textarea id="opinion" placeholder="例：減税希望、婚姻名別性に否定的、移民制限、反中国 など"></textarea>

  <label for="exclude">除外したい政党や勢力（カンマ区切り）</label>
  <input type="text" id="exclude" placeholder="例：自治、立懿、共産党">

  <button onclick="generatePrompt()">プロンプト生成</button>

  <div class="output-area">
    <h2>🔻 ChatGPTにコピペするプロンプト</h2>
    <textarea id="output" readonly></textarea>
  </div>

  <script>
    function generatePrompt() {
      const region = document.getElementById('region').value.trim();
      const opinion = document.getElementById('opinion').value.trim();
      const exclude = document.getElementById('exclude').value.trim();

      const prompt = 
`私は${region}に住んでいます。以下のような政治的な考え方を持っています：

${opinion}

以上をふまえて、次の参議院選挙で私の考えに合う候補者を教えてください。
以下の政党は除外してください：${exclude}。

農政、経済、安全保障の89観点を重視します。`;

      document.getElementById('output').value = prompt;
    }
  </script>
</body>
</html>
