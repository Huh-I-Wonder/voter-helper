<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>候補者マッチングプロンプト生成</title>
  <style>
    body {
      font-family: 'Yu Gothic UI', sans-serif;
      background: #f2f4fc;
      color: #333;
      padding: 2em;
      max-width: 700px;
      margin: auto;
    }
    h1 {
      font-size: 1.6em;
      color: #2b3674;
      margin-bottom: 1em;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 1.5em;
      margin-bottom: 0.3em;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 0.8em;
      border: 1px solid #ccc;
      border-radius: 0.5em;
      font-size: 1em;
      box-sizing: border-box;
    }
    button {
      background-color: #5865f2;
      color: white;
      border: none;
      margin-top: 1.5em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #4752c4;
    }
    textarea {
      height: 150px;
    }
    .output-area {
      margin-top: 2em;
      background: #fff;
      border: 1px dashed #999;
      padding: 1em;
      border-radius: 0.5em;
    }
    .output-area h2 {
      margin-top: 0;
      font-size: 1.2em;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>🗳️ あなたに合う候補者をChatGPTで探すプロンプト作成</h1>

  <label for="region">あなたの選挙区（都道府県）</label>
  <select id="region">
    <option value="">-- 都道府県を選んでください --</option>
    <!-- 都道府県の選択肢省略（元のまま） -->
    <option value="沖縄県">沖縄県</option>
  </select>

  <label for="opinion">あなたの政治的な考え方</label>
  <textarea id="opinion" placeholder="例：教育の充実、持続可能なエネルギー政策、食料安全保障、子育て支援の強化 など"></textarea>

  <label for="preferredParties">支持してもいい政党（複数可）</label>
  <select id="preferredParties" multiple>
    <option value="">（選択なし）</option>
    <option value="自由民主党">自由民主党</option>
    <option value="立憲民主党">立憲民主党</option>
    <option value="日本維新の会">日本維新の会</option>
    <option value="公明党">公明党</option>
    <option value="国民民主党">国民民主党</option>
    <option value="日本共産党">日本共産党</option>
    <option value="れいわ新選組">れいわ新選組</option>
    <option value="参政党">参政党</option>
    <option value="社会民主党">社会民主党</option>
    <option value="日本保守党">日本保守党</option>
    <option value="無所属">無所属</option>
  </select>

  <label for="exclude">除外したい政党や勢力（複数可）</label>
  <select id="exclude" multiple>
    <option value="">（選択なし）</option>
    <option value="自由民主党">自由民主党</option>
    <option value="立憲民主党">立憲民主党</option>
    <option value="日本維新の会">日本維新の会</option>
    <option value="公明党">公明党</option>
    <option value="国民民主党">国民民主党</option>
    <option value="日本共産党">日本共産党</option>
    <option value="れいわ新選組">れいわ新選組</option>
    <option value="参政党">参政党</option>
    <option value="社会民主党">社会民主党</option>
    <option value="日本保守党">日本保守党</option>
    <option value="無所属">無所属</option>
  </select>

  <button onclick="generatePrompt()">プロンプト生成</button>

  <div class="output-area">
    <h2>🔽 ChatGPTにコピペするプロンプト</h2>
    <textarea id="output" readonly></textarea>
  </div>

  <script>
    function getSelectedValues(selectElement) {
      return Array.from(selectElement.selectedOptions)
        .map(option => option.value)
        .filter(v => v !== '');
    }

    function generatePrompt() {
      const region = document.getElementById('region').value.trim();
      const opinion = document.getElementById('opinion').value.trim();
      const preferred = getSelectedValues(document.getElementById('preferredParties'));
      const exclude = getSelectedValues(document.getElementById('exclude'));

      const prompt = 
`私は${region}に住んでいます。
以下のような政治的な考え方を持っています：
${opinion}

比例代表では以下の政党を支持する傾向があります：${preferred.length ? preferred.join('、') : '（特になし）'}
以下の政党は支持対象外としています：${exclude.length ? exclude.join('、') : '（特になし）'}

以上を踏まえて、選挙区・比例の両方において、私の考えに合いそうな候補者を教えてください。`;

      document.getElementById('output').value = prompt;
    }
  </script>
</body>
</html>
