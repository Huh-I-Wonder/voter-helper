<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>候補者マッチングプロンプト生成</title>
  <style>
    body {
      font-family: 'Yu Gothic UI', sans-serif;
      background: #f2f4fc;
      color: #333;
      padding: 2em;
      max-width: 700px;
      margin: auto;
    }
    h1 {
      font-size: 1.6em;
      color: #2b3674;
      margin-bottom: 1em;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 1.5em;
      margin-bottom: 0.3em;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 0.8em;
      border: 1px solid #ccc;
      border-radius: 0.5em;
      font-size: 1em;
      box-sizing: border-box;
    }
    button {
      background-color: #5865f2;
      color: white;
      border: none;
      margin-top: 1.5em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #4752c4;
    }
    textarea {
      height: 150px;
    }
    .output-area {
      margin-top: 2em;
      background: #fff;
      border: 1px dashed #999;
      padding: 1em;
      border-radius: 0.5em;
    }
    .output-area h2 {
      margin-top: 0;
      font-size: 1.2em;
      color: #444;
    }
    .card-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      margin-top: 1em;
    }
    .card {
      background: white;
      border: 1px solid #ccc;
      border-radius: 0.5em;
      padding: 1em;
      cursor: pointer;
      flex: 1 1 calc(33% - 1em);
      transition: border-color 0.2s;
      box-sizing: border-box;
      text-align: center;
    }
    .card:hover {
      border-color: #5865f2;
    }
    .card.selected {
      border-color: #5865f2;
      background-color: #e7e9ff;
    }
  </style>
</head>
<body>
  <h1>🗳️ あなたに合う候補者をChatGPTで探すプロンプト作成</h1>

  <label for="region">あなたの選挙区（都道府県）</label>
  <select id="region">
    <option value="">-- 都道府県を選んでください --</option>
    <option value="北海道">北海道</option>
    <option value="青森県">青森県</option>
    <option value="岩手県">岩手県</option>
    <option value="宮城県">宮城県</option>
    <option value="秋田県">秋田県</option>
    <option value="山形県">山形県</option>
    <option value="福島県">福島県</option>
    <option value="茨城県">茨城県</option>
    <option value="栃木県">栃木県</option>
    <option value="群馬県">群馬県</option>
    <option value="埼玉県">埼玉県</option>
    <option value="千葉県">千葉県</option>
    <option value="東京都">東京都</option>
    <option value="神奈川県">神奈川県</option>
    <option value="新潟県">新潟県</option>
    <option value="富山県">富山県</option>
    <option value="石川県">石川県</option>
    <option value="福井県">福井県</option>
    <option value="山梨県">山梨県</option>
    <option value="長野県">長野県</option>
    <option value="岐阜県">岐阜県</option>
    <option value="静岡県">静岡県</option>
    <option value="愛知県">愛知県</option>
    <option value="三重県">三重県</option>
    <option value="滋賀県">滋賀県</option>
    <option value="京都府">京都府</option>
    <option value="大阪府">大阪府</option>
    <option value="兵庫県">兵庫県</option>
    <option value="奈良県">奈良県</option>
    <option value="和歌山県">和歌山県</option>
    <option value="鳥取県">鳥取県</option>
    <option value="島根県">島根県</option>
    <option value="岡山県">岡山県</option>
    <option value="広島県">広島県</option>
    <option value="山口県">山口県</option>
    <option value="徳島県">徳島県</option>
    <option value="香川県">香川県</option>
    <option value="愛媛県">愛媛県</option>
    <option value="高知県">高知県</option>
    <option value="福岡県">福岡県</option>
    <option value="佐賀県">佐賀県</option>
    <option value="長崎県">長崎県</option>
    <option value="熊本県">熊本県</option>
    <option value="大分県">大分県</option>
    <option value="宮崎県">宮崎県</option>
    <option value="鹿児島県">鹿児島県</option>
    <option value="沖縄県">沖縄県</option>
  </select>

  <label>あなたの政治的なスタンスを選んでください（複数選択可）</label>
  <div class="card-container" id="stance-cards">
    <div class="card">減税に賛成</div>
    <div class="card">移民に反対</div>
    <div class="card">夫婦別姓に慎重</div>
    <div class="card">防衛力強化</div>
    <div class="card">公共投資拡大</div>
    <div class="card">農業支援強化</div>
    <div class="card">金融緩和維持</div>
    <div class="card">教育改革</div>
  </div>

  <label>支持してもよい政党（複数選択可）</label>
  <div class="card-container" id="include-parties">
  <div class="card">自由民主党（自民党）</div>
  <div class="card">立憲民主党（立憲）</div>
  <div class="card">日本維新の会</div>
  <div class="card">公明党</div>
  <div class="card">国民民主党（国民）</div>
  <div class="card">日本共産党（共産）</div>
  <div class="card">れいわ新選組</div>
  <div class="card">参政党</div>
  <div class="card">社会民主党（社民）</div>
  <div class="card">日本保守党</div>
  <div class="card">無所属</div>
</div>

  <label>除外したい政党（複数選択可）</label>
  <div class="card-container" id="exclude-parties">
  <div class="card">自由民主党（自民党）</div>
  <div class="card">立憲民主党（立憲）</div>
  <div class="card">日本維新の会</div>
  <div class="card">公明党</div>
  <div class="card">国民民主党（国民）</div>
  <div class="card">日本共産党（共産）</div>
  <div class="card">れいわ新選組</div>
  <div class="card">参政党</div>
  <div class="card">社会民主党（社民）</div>
  <div class="card">日本保守党</div>
  <div class="card">無所属</div>
</div>
  </div>

  <button onclick="generatePrompt()">プロンプトを生成する</button>

  <div class="output-area" id="output">
    <h2>📝 生成されたプロンプト</h2>
    <textarea readonly id="prompt-text"></textarea>
  </div>

  <script>
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        card.classList.toggle('selected');
      });
    });

    function generatePrompt() {
      const region = document.getElementById('region').value;
      const stances = Array.from(document.querySelectorAll('#stance-cards .selected')).map(el => el.textContent);
      const includeParties = Array.from(document.querySelectorAll('#include-parties .selected')).map(el => el.textContent);
      const excludeParties = Array.from(document.querySelectorAll('#exclude-parties .selected')).map(el => el.textContent);

      let conflict = includeParties.some(party => excludeParties.includes(party));
      if (conflict) {
        alert("同じ政党が支持・除外の両方に含まれています。確認してください。");
        return;
      }

      let prompt = `以下の条件に合致する候補者を、${region}選挙区および比例代表から探してください。\n`;
      if (stances.length > 0) {
        prompt += `重視する政策スタンスは：${stances.join('、')}。\n`;
      }
      if (includeParties.length > 0) {
        prompt += `支持してもよい政党：${includeParties.join('、')}。\n`;
      }
      if (excludeParties.length > 0) {
        prompt += `除外したい政党：${excludeParties.join('、')}。\n`;
      }
      prompt += `候補者名と簡単な理由も一緒に提示してください。`;

      document.getElementById('prompt-text').value = prompt;
    }
  </script>
</body>
</html>
